name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepara progetto Android
        run: |
          flutter create --platforms=android --org com.designer1974 --project-name table_translator .
          rm -f test/widget_test.dart
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk( =|Version)? *flutter\.minSdkVersion/minSdk = 24/' "$f" && grep -n "minSdk" "$f" || true
          done
          printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts <<'KTS'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../devoo.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          KTS

      # Firma sempre uguale: ogni versione si installa sopra la precedente
      - name: Firma fissa
        run: mkdir -p ~/.android && cp android/devoo.keystore ~/.android/debug.keystore

      - name: Dipendenze
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter pub get > out.txt 2>&1 || { report out.txt "because|depends|incompatible|version solving" PubGet; exit 1; }

      - name: Controllo codice
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter analyze --no-fatal-infos --no-fatal-warnings > out.txt 2>&1 || { report out.txt "error •" Analyze; exit 1; }

      - name: Test
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter test > out.txt 2>&1 || { report out.txt "Expected|Actual|Error|error|FAILED|\\.dart:[0-9]+" Test; exit 1; }

      # Un APK per tipo di processore: molto più leggero
      - name: Compila APK
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter build apk --release --dart-define=BUILD=${{ github.run_number }} --split-per-abi --target-platform android-arm64,android-arm > out.txt 2>&1 || { grep -A25 "What went wrong" out.txt > err.txt || true; grep -E "^e: |error:" out.txt | head -20 >> err.txt || true; report err.txt "." Build; exit 1; }

      - name: Rinomina APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DevooTranslator.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk DevooTranslator-telefoni-vecchi.apk
          ls -la *.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Devoo Translator build ${{ github.run_number }}
          body: |
            **DevooTranslator.apk** → per quasi tutti i telefoni (anche Huawei P30 Lite).
            DevooTranslator-telefoni-vecchi.apk → solo per telefoni molto vecchi a 32 bit.
          files: |
            DevooTranslator.apk
            DevooTranslator-telefoni-vecchi.apk
          make_latest: true
