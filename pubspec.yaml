name: table_translator
description: Devoo Translator - traduttore vocale istantaneo italiano, inglese, spagnolo, darija.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: any
  record: any
  google_mlkit_translation: any
  google_mlkit_language_id: any
  flutter_tts: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
